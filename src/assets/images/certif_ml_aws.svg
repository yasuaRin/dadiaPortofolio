<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="100%" height="100%">
  <defs>
    <!-- Top-left subtle mint to sky-blue aura -->
    <radialGradient id="awsCertAura" cx="0%" cy="0%" r="70%" fx="0%" fy="0%">
      <stop offset="0%" stop-color="#C6F6D5" stop-opacity="0.75" />
      <stop offset="25%" stop-color="#D1FAE5" stop-opacity="0.5" />
      <stop offset="55%" stop-color="#E0F2FE" stop-opacity="0.3" />
      <stop offset="85%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <filter id="softPaperShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Base Certificate Sheet -->
  <rect width="800" height="580" rx="4" fill="#FFFFFF" />
  <!-- Aura Wash -->
  <rect width="800" height="580" rx="4" fill="url(#awsCertAura)" />

  <!-- Content Group with Safe Margin -->
  <g id="cert-content">
    <!-- Header -->
    <text x="64" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111827">AWS Training &amp; Certification</text>
    <text x="64" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#111827">Completion Certificate</text>

    <!-- Course Title (Two Lines) -->
    <text x="64" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="37" font-weight="700" letter-spacing="-0.025em" fill="#0F172A">Planning a Machine</text>
    <text x="64" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="37" font-weight="700" letter-spacing="-0.025em" fill="#0F172A">Learning Project</text>

    <!-- Completed Date -->
    <text x="64" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#334155">Completed: May 16, 2025</text>

    <!-- Awarded To -->
    <text x="64" y="358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#334155">Awarded to</text>
    <text x="64" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20.5" font-weight="700" letter-spacing="-0.01em" fill="#0F172A">Ni Putu Dadia Yasuarini</text>

    <!-- Signature of Michelle Vaz -->
    <g transform="translate(64, 428)">
      <!-- Authentic handwritten cursive ink path -->
      <path d="M 2 24 C 6 12, 11 2, 15 2 C 18 2, 17 22, 18 25 C 21 16, 24 10, 27 10 C 30 10, 29 23, 31 24 C 33 16, 36 9, 39 9 C 42 9, 41 23, 43 24 C 45 20, 48 19, 50 21 C 52 24, 52 25, 54 22 C 55 18, 57 17, 59 18 C 61 20, 60 25, 62 25 C 64 20, 66 5, 68 3 C 70 1, 71 8, 71 24 C 73 18, 76 6, 78 4 C 80 2, 81 12, 81 24 C 83 20, 85 19, 87 21 C 91 25, 96 24, 100 22 M 106 12 C 103 16, 101 24, 104 26 C 107 28, 114 18, 118 10 C 121 4, 122 8, 122 14 C 122 21, 125 24, 128 24 C 131 24, 134 20, 135 18 C 137 15, 137 23, 138 25 C 140 22, 143 19, 146 19 C 149 19, 149 24, 148 29 C 146 36, 141 44, 137 45 C 134 46, 133 42, 136 38 C 141 33, 150 28, 156 26" fill="none" stroke="#263238" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Signatory Info -->
    <text x="64" y="482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Michelle Vaz</text>
    <text x="64" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#334155">Director, AWS Training &amp; Certification</text>

    <!-- AWS Logo (Bottom Right) -->
    <g transform="translate(605, 436)">
      <!-- aws text in authentic geometry -->
      <g fill="#161F2E">
        <!-- 'a' -->
        <path d="M 12.8 30.2 C 11.2 31.8, 9 32.7, 6.4 32.7 C 2.3 32.7, 0 30.1, 0 26.2 C 0 21.6, 3.4 19.3, 9.8 19.3 L 12.8 19.3 L 12.8 17.6 C 12.8 14.8, 11.2 13.5, 8.4 13.5 C 6.2 13.5, 4.4 14.3, 3.2 15.6 L 0.8 12.4 C 2.8 10.4, 5.7 9.2, 9.2 9.2 C 14.8 9.2, 17.6 11.8, 17.6 17.1 L 17.6 32.2 L 12.8 32.2 L 12.8 30.2 Z M 12.8 23.4 L 10.4 23.4 C 6.6 23.4, 4.8 24.5, 4.8 26.5 C 4.8 28.2, 5.9 29.1, 7.8 29.1 C 10.6 29.1, 12.8 27.2, 12.8 24.6 L 12.8 23.4 Z" />
        <!-- 'w' -->
        <path d="M 20.6 9.7 L 25.4 9.7 L 28.4 23.6 L 31.8 9.7 L 36.4 9.7 L 39.8 23.6 L 42.8 9.7 L 47.4 9.7 L 42.6 32.2 L 37.6 32.2 L 34.1 18.2 L 30.4 32.2 L 25.4 32.2 Z" />
        <!-- 's' -->
        <path d="M 52.8 28.2 C 54.4 29.2, 56.5 29.7, 58.7 29.7 C 61.5 29.7, 62.8 28.7, 62.8 27.3 C 62.8 25.9, 61.7 25.2, 58.6 24.4 C 54.2 23.4, 50.8 21.9, 50.8 16.7 C 50.8 12.2, 54.4 9.2, 59.8 9.2 C 62.6 9.2, 65.2 10, 67.2 11.5 L 65 14.9 C 63.4 13.9, 61.5 13.3, 59.7 13.3 C 57.3 13.3, 55.8 14.3, 55.8 15.8 C 55.8 17.3, 57.1 18, 59.9 18.7 C 64.7 19.9, 67.8 21.4, 67.8 26.6 C 67.8 31.5, 63.8 33.8, 58.4 33.8 C 55.2 33.8, 52.3 32.9, 50.2 31.2 L 52.8 28.2 Z" />
      </g>
      <!-- aws smile arrow (dark slate/black as shown in official cert) -->
      <path d="M -3 42 C 22 55, 52 55, 76 43" fill="none" stroke="#161F2E" stroke-width="3.6" stroke-linecap="round" />
      <polygon points="73,38 84,43 78,50" fill="#161F2E" />
    </g>
  </g>
</svg>
