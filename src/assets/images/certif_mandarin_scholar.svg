<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 580" width="100%" height="100%">
  <defs>
    <!-- Soft Background Gradients -->
    <linearGradient id="warmYellowArc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#FEF08A" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="skyBlueWave" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#E0F2FE" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Star Polygon -->
    <polygon id="goldStar" points="0,-6 1.8,-1.8 6.3,-1.8 2.7,0.9 4.1,5.4 0,2.7 -4.1,5.4 -2.7,0.9 -6.3,-1.8 -1.8,-1.8" fill="#FACC15" />
  </defs>

  <!-- Clean Base Paper -->
  <rect width="840" height="580" fill="#FFFFFF" />

  <!-- Top-Left Soft Yellow Arc -->
  <path d="M 0 0 L 260 0 C 180 180, 80 260, 0 320 Z" fill="url(#warmYellowArc)" />

  <!-- Lower Sky Blue Wave -->
  <path d="M 0 320 C 100 240, 240 380, 420 480 C 520 540, 680 560, 840 530 L 840 580 L 0 580 Z" fill="url(#skyBlueWave)" />

  <!-- Top Center: National Emblem of the People's Republic of China -->
  <g transform="translate(420, 52)">
    <!-- Red Circular Shield -->
    <circle cx="0" cy="0" r="34" fill="#DC2626" stroke="#B91C1C" stroke-width="1.5" />

    <!-- Golden Ears of Grain (Wheat Wreath Framing Sides) -->
    <path d="M -24 16 C -32 4, -30 -14, -20 -24 C -22 -14, -20 2, -12 18 Z" fill="#FACC15" />
    <path d="M 24 16 C 32 4, 30 -14, 20 -24 C 22 -14, 20 2, 12 18 Z" fill="#FACC15" />

    <!-- Golden Cogwheel at Base -->
    <rect x="-12" y="16" width="24" height="10" rx="3" fill="#FACC15" />
    <circle cx="0" cy="21" r="3" fill="#DC2626" />

    <!-- Tiananmen Gate Outline -->
    <rect x="-14" y="6" width="28" height="8" fill="#FACC15" />
    <polygon points="0,-4 -18,6 18,6" fill="#FACC15" />

    <!-- Five Golden Stars -->
    <!-- Center Big Star -->
    <use href="#goldStar" x="0" y="-12" transform="scale(1.2)" />
    <!-- Four Arched Little Stars -->
    <use href="#goldStar" x="-12" y="-14" transform="scale(0.55) rotate(-30)" />
    <use href="#goldStar" x="-7" y="-22" transform="scale(0.55) rotate(-15)" />
    <use href="#goldStar" x="7" y="-22" transform="scale(0.55) rotate(15)" />
    <use href="#goldStar" x="12" y="-14" transform="scale(0.55) rotate(30)" />
  </g>

  <!-- Titles -->
  <g text-anchor="middle">
    <!-- "证书" -->
    <text x="420" y="132" font-family="'Songti SC', 'STSong', 'SimSun', 'Noto Serif SC', serif" font-size="34" font-weight="700" letter-spacing="0.3em" fill="#1F2937">证  书</text>

    <!-- "Sertifikat Beasiswa" -->
    <text x="420" y="172" font-family="'Times New Roman', Times, serif" font-size="28" font-weight="700" letter-spacing="0.05em" fill="#1F2937">Sertifikat Beasiswa</text>

    <!-- Chinese Award Line -->
    <text x="420" y="222" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="500" fill="#1F2937">Ni Putu Dadia Yasuarini 荣获2018/2019学年</text>
    <text x="420" y="258" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700" letter-spacing="0.08em" fill="#111827">中国总领事奖学金 进步奖</text>

    <!-- Indonesian Translation Section -->
    <g font-family="'Georgia', serif" font-size="14.5" font-style="italic" fill="#374151">
      <text x="420" y="306">Sertifikat ini diberikan kepada: <tspan font-weight="700" font-style="normal">Ni Putu Dadia Yasuarini</tspan></text>
      <text x="420" y="332">Sebagai peraih beasiswa Konjen RRT kategori Beasiswa Kemajuan</text>
      <text x="420" y="358">untuk tahun ajaran 2018/2019</text>
    </g>

    <!-- Date -->
    <text x="420" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#4B5563">Denpasar, 13 Agustus 2019</text>
  </g>

  <!-- Signatory (Gou Haodong / 苟皓东) -->
  <g transform="translate(420, 440)" text-anchor="middle">
    <!-- Authentic Chinese Calligraphy Signature: 苟皓东 -->
    <path d="M -35 2 C -30 -1, -26 14, -22 14 M -38 6 L -16 6 M -28 6 L -28 20 M -12 -2 C -10 16, -6 16, 2 12 M -6 -2 L 10 -2 M 2 5 L 8 16 M 16 0 C 18 10, 24 18, 35 15 M 18 8 L 32 4 M 26 2 L 26 18" fill="none" stroke="#111827" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

    <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#111827">Gou Haodong</text>
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="400" fill="#4B5563">Konsul Jenderal RRT di Denpasar</text>
    <text x="0" y="68" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" font-weight="600" fill="#111827">中国驻登巴萨总领事</text>
  </g>

  <!-- Bottom-Right Stack of Books Illustration -->
  <g transform="translate(735, 485)">
    <!-- Book 1 (Bottom, Red) -->
    <polygon points="-65,30 20,48 55,28 -30,12" fill="#DC2626" />
    <polygon points="-65,30 20,48 20,54 -65,36" fill="#B91C1C" />
    <polygon points="20,48 55,28 55,34 20,54" fill="#F1F5F9" />

    <!-- Book 2 (Middle, Light Blue) -->
    <polygon points="-60,18 15,35 48,16 -32,2" fill="#38BDF8" />
    <polygon points="-60,18 15,35 15,41 -60,24" fill="#0284C7" />
    <polygon points="15,35 48,16 48,22 15,41" fill="#F8FAFC" />

    <!-- Book 3 (Top, Dark Navy) -->
    <polygon points="-55,6 10,22 40,4 -35,-8" fill="#1E293B" />
    <polygon points="-55,6 10,22 10,28 -55,12" fill="#0F172A" />
    <polygon points="10,22 40,4 40,10 10,28" fill="#F8FAFC" />
  </g>
</svg>
