<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 580" width="100%" height="100%">
  <defs>
    <!-- Diagonal Stripes Pattern for the Circle -->
    <pattern id="diagStripes" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#FFFFFF" stroke-width="4.5" />
    </pattern>
  </defs>

  <!-- Outer Certificate Base -->
  <rect width="840" height="580" fill="#FFFFFF" />

  <!-- Top Header Banner (White) -->
  <rect x="0" y="0" width="840" height="74" fill="#FFFFFF" />

  <!-- Sekolah Ciputra Logo (Top Left) -->
  <g transform="translate(36, 22)">
    <!-- Leaf Icon -->
    <path d="M 0 24 C 6 8, 22 2, 34 2 C 28 16, 16 26, 0 24 Z" fill="#0D9488" />
    <path d="M 8 28 C 16 18, 30 14, 38 12 C 32 24, 20 30, 8 28 Z" fill="#14B8A6" opacity="0.6" />
    <!-- Text -->
    <text x="46" y="24" font-family="'Times New Roman', Times, serif" font-size="25" font-weight="700" letter-spacing="0.08em" fill="#1E293B">SEKOLAH CIPUTRA</text>
  </g>

  <!-- Accreditation Badges (Top Right) -->
  <g transform="translate(560, 22)">
    <!-- Crest -->
    <g transform="translate(0, 0)">
      <rect x="0" y="2" width="26" height="30" rx="3" fill="none" stroke="#64748B" stroke-width="1.2" />
      <path d="M 13 4 L 13 30 M 2 16 L 24 16" stroke="#64748B" stroke-width="1" />
    </g>

    <!-- WASC Badge -->
    <g transform="translate(48, 4)">
      <text x="0" y="6" font-family="sans-serif" font-size="7" font-weight="600" fill="#64748B">Fully Accredited by</text>
      <text x="0" y="22" font-family="sans-serif" font-size="16" font-weight="900" fill="#D97706">OWASC</text>
    </g>

    <!-- IB World School Circle -->
    <g transform="translate(155, 16)">
      <circle cx="14" cy="2" r="14" fill="#0284C7" />
      <text x="14" y="7" text-anchor="middle" font-family="serif" font-size="15" font-style="italic" font-weight="700" fill="#FFFFFF">ib</text>
    </g>

    <!-- Council Badge -->
    <g transform="translate(205, 12)">
      <circle cx="8" cy="6" r="6" fill="#F59E0B" />
      <circle cx="18" cy="6" r="6" fill="#0284C7" />
      <circle cx="28" cy="6" r="6" fill="#10B981" />
    </g>
  </g>

  <!-- Main Body (Dark Slate Background) -->
  <rect x="0" y="74" width="840" height="506" fill="#24292E" />

  <!-- Diagonal Striped Circle Badge (Left Side) -->
  <g transform="translate(24, 96)">
    <circle cx="76" cy="115" r="82" fill="url(#diagStripes)" />
  </g>

  <!-- Golden/Coral Headings -->
  <g text-anchor="middle">
    <!-- "CERTIFICATE OF" -->
    <text x="490" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="0.18em" fill="#F59E0B">CERTIFICATE OF</text>

    <!-- "ACHIEVEMENT" -->
    <text x="490" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="900" letter-spacing="0.1em" fill="#F97316">ACHIEVEMENT</text>

    <!-- "We Proudly Present This To" -->
    <text x="490" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#CBD5E1">We Proudly Present This To</text>

    <!-- Recipient Name -->
    <text x="490" y="306" font-family="'Times New Roman', Times, serif" font-size="34" font-weight="700" letter-spacing="0.02em" fill="#FFFFFF">Ni Putu Dadia Yasuarini</text>
    <line x1="250" y1="322" x2="730" y2="322" stroke="#FFFFFF" stroke-width="1.8" />
  </g>

  <!-- Award Citation Text -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#E2E8F0">
    <text x="490" y="360">For successfully achieving <tspan font-weight="700">3rd place</tspan> in the <tspan font-weight="700">English</tspan></text>
    <text x="490" y="384"><tspan font-weight="700">Video Speech Competition – SMA Category</tspan> at the 2022</text>
    <text x="490" y="408">Sekolah Ciputra Decathlon. We congratulate her for her</text>
    <text x="490" y="432">achievement in this competition.</text>
  </g>

  <!-- Bottom Signatures & Seal Section -->
  <g transform="translate(0, 435)">
    <!-- Terry Swain Signature (Left) -->
    <g transform="translate(160, 0)">
      <!-- Authentic Cursive Signature Line -->
      <path d="M 8 28 C 14 12, 18 4, 25 4 C 32 4, 30 28, 48 20 C 58 16, 68 28, 85 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <line x1="0" y1="36" x2="160" y2="36" stroke="#94A3B8" stroke-width="1" />
      <text x="80" y="54" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="0.05em" fill="#FFFFFF">TERRY SWAIN</text>
      <text x="80" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#94A3B8">High School</text>
      <text x="80" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#94A3B8">Coordinating Principal</text>
    </g>

    <!-- Center Circular Seal (Sekolah Ciputra Surabaya) -->
    <g transform="translate(420, 48)">
      <circle cx="0" cy="0" r="48" fill="#1E293B" stroke="#CBD5E1" stroke-width="2" />
      <circle cx="0" cy="0" r="44" fill="none" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2 2" />
      <!-- Seal Emblem -->
      <path d="M -16 -2 C -6 -16, 12 -12, 18 2 C 10 14, -8 16, -16 -2 Z" fill="#38BDF8" opacity="0.8" />
      <!-- Curved Text Placeholders -->
      <text x="0" y="-28" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" letter-spacing="0.1em" fill="#FFFFFF">SEKOLAH CIPUTRA SURABAYA</text>
      <text x="0" y="34" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" letter-spacing="0.12em" fill="#FFFFFF">HIGH SCHOOL</text>
    </g>

    <!-- Mark Hukom Signature (Right) -->
    <g transform="translate(560, 0)">
      <!-- Authentic Cursive Signature Line -->
      <path d="M 12 32 C 18 10, 24 2, 30 18 C 36 28, 42 6, 48 18 C 55 28, 62 10, 72 26 C 80 18, 92 24, 102 28" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
      <line x1="0" y1="36" x2="160" y2="36" stroke="#94A3B8" stroke-width="1" />
      <text x="80" y="54" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="0.05em" fill="#FFFFFF">MARK HUKOM</text>
      <text x="80" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#94A3B8">High School</text>
      <text x="80" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#94A3B8">Principal</text>
    </g>
  </g>

  <!-- Bottom-Right Gold Arc Accent -->
  <g transform="translate(840, 580)">
    <circle cx="0" cy="0" r="140" fill="#F59E0B" opacity="0.9" />
    <circle cx="0" cy="0" r="120" fill="#FBBF24" opacity="0.6" />
    <circle cx="0" cy="0" r="95" fill="#24292E" />
  </g>
</svg>
